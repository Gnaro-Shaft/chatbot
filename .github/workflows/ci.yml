name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install ruff black

      - name: Ruff check
        run: ruff check src/

      - name: Black check
        run: black --check --quiet src/

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-mock pytest-cov

      - name: Run tests
        run: pytest tests/ --no-header -v --cov=src/chatbot --cov-report=term-missing

      - name: Coverage gate (>= 90%)
        run: |
          COVERAGE=$(python -c "
          import subprocess, json
          subprocess.check_output(
              ['pytest', 'tests/', '--cov=src/chatbot', '--cov-report=json:.coverage.json'],
              capture_output=True, text=True)
          data = json.load(open('.coverage.json'))
          total = data['totals']['num_statements']
          missed = data['totals']['missing_lines']
          pct = 100.0 * (total - missed) / max(total, 1)
          print(f'{pct:.1f}%', end=',')
          print('PASS' if pct >= 90.0 else 'FAIL')
          ")
          PCT=$(echo "$COVERAGE" | cut -d, -f1)
          STATUS=$(echo "$COVERAGE" | cut -d, -f2)
          echo "Couverture: $PCT"
          if [ "$STATUS" != "PASS" ]; then
            echo "Couverture < 90% : echec"
            exit 1
          fi
